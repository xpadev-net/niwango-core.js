name: Quality

on:
  push:
    paths:
      - "src/**"
      - "util/check-workflows.mjs"
      - "util/generate-parser.js"
      - "util/package-smoke.mjs"
      - "util/resolve-path-alias.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "biome.json"
      - "tsconfig*.json"
      - "rollup.config*.mjs"
      - "vitest.config.ts"
      - ".babelrc.js"
      - ".github/workflows/**"
  pull_request:
    branches: [ develop ]
    paths:
      - "src/**"
      - "util/check-workflows.mjs"
      - "util/generate-parser.js"
      - "util/package-smoke.mjs"
      - "util/resolve-path-alias.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "biome.json"
      - "tsconfig*.json"
      - "rollup.config*.mjs"
      - "vitest.config.ts"
      - ".babelrc.js"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm install -g pnpm
          pnpm install

      - name: Run quality checks
        run: pnpm lint

      - name: Run tests
        run: pnpm test --run
