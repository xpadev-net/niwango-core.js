pre-commit:
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx,mjs,cjs}"
      run: npx biome check --write --unsafe {staged_files}
      stage_fixed: true
    test:
      glob: "src/**/*.{js,ts,jsx,tsx,mjs,cjs}"
      run: pnpm test --run
    typecheck:
      glob: "src/**/*.{js,ts,jsx,tsx,mjs,cjs}"
      run: npx tsc --noEmit --jsx react
